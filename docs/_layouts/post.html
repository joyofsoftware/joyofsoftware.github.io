---
layout: default
---
<p></p>
<h1>{{ page.title }}</h1>
<small>{{ page.date | date: "%d %B %Y" }}</small>
{% if page.guest_author %}
  <p class="view">by {{ page.guest_author | default: site.author }}</p>
{% else %}
  <p></p>
{% endif %}

{{content}}

<p></p>
{% if page.tags %}
  <small>tags: <em>{{ page.tags | join: "</em> - <em>" }}</em></small>
{% endif %}
