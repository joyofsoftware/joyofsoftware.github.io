<script src="https://unpkg.com/d3@5.9.1/dist/d3.min.js"></script>
<script src="https://unpkg.com/scrollama"></script>
<script>
  // using d3 for convenience
  var main = d3.select("main");
  var scrolly = main.select("#scrolly");
  var figure = scrolly.select("figure");
  var article = scrolly.select("article");
  var step = article.selectAll(".step");
  var pageslug = '{{ page.name | slugify }}';
  // set up array of figures depending on the front matter
  // Links => all the figures are sourced from external links
  // Text => all the figures are text and will be rendered prior to display
  // default => the figures are in /assets/img/ and named page.slug-0.png, page.slug-1.png, page.slug-2.png, etc
  {% if page.scrolly_images == "Image" %}
    // get the image tags from the file /assets/includes/pageslug-images.html
    {% capture imageFileName %}{{ page.name | slugify }}-image.html{% endcapture %}
    {% include {{ imageFileName }} %}
  {% elsif page.scrolly_images == "Text" %}
    // build text boxes based on array of text
  {% else %}
    // by default we don't build an array of tags here instead
    // the tag is built in handleStepEnter
  {% endif %}

  // initialize the scrollama
  var scroller = scrollama();

  // generic window resize listener event
  function handleResize() {
    // 1. update height of step elements
    var stepH = Math.floor(window.innerHeight * 0.75);
    step.style("height", stepH + "px");

    var figureHeight = window.innerHeight / 2;
    var figureMarginTop = (window.innerHeight - figureHeight) / 2;

    figure
      .style("height", figureHeight + "px")
      .style("top", figureMarginTop + "px");

    // 3. tell scrollama to update new element dimensions
    scroller.resize();
  }

  // scrollama event handlers
  function handleStepEnter(response) {
    console.log(response);
    // response = { element, direction, index }

    // add color to current step only
    step.classed("is-active", function (d, i) {
      return i === response.index;
    });

    // update graphic based on step
    // figure.select("p").text(response.index + 1);

		// update figure based on step
    var imageTag='';
    {% if page.scrolly_images == "Image" %}
      imageTag=figureTags[response.index];
    {% elsif page.scrolly_images == "Text" %}
      // build text based on array of text initialized earlier
      imageTag='<p style="color: #BBBBBB;">Joy of Software' + response.index + '</p>';
    {% else %}
      // by default figures need to be named page.slug-0.png, page.slug-1.png, page.slug-2.png, etc
      var imageTag='<img src="\\assets\\img\\' + pageslug + '-' + response.index + '.png">';
    {% endif %}
    console.log(imageTag);
    figure.select(".figure-box").html(imageTag);

  }

  function init() {

    // 1. force a resize on load to ensure proper dimensions are sent to scrollama
    handleResize();

    // 2. setup the scroller passing options
    // 		this will also initialize trigger observations
    // 3. bind scrollama event handlers (this can be chained like below)
    scroller
      .setup({
        step: "#scrolly article .step",
        offset: 0.3,
        debug: false
      })
      .onStepEnter(handleStepEnter);
    // force a stepEnter to display everything before scrolling
    var stepDiv = document.createElement("div");
    stepDiv.className = "step";
    var initialResponse = {
      element: stepDiv,
      index: 0,
      direction: "static"
    }
    handleStepEnter( initialResponse );
  }

  // kick things off
  init();
</script>
